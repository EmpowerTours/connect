[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
# "osaka" so the test EVM has the P256VERIFY precompile at 0x100 (EIP-7951),
# as Monad does; without it OZ P256 silently falls back to a ~300k-gas Solidity
# verifier and gas numbers lie. solc 0.8.28 caps the bytecode target at prague,
# which adds no opcodes over cancun.
evm_version = "osaka"
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 120, fail_on_revert = false }
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.lint]
lint_on_build = false

[profile.deep]
fuzz = { runs = 20000 }
invariant = { runs = 512, depth = 300, fail_on_revert = false }
